name: Quantum class alerts
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch recent USPTO documents
        env:
          USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
        run: python3 scripts/uspto_recent.py > "$GITHUB_WORKSPACE/uspto-candidates.json"
      - name: File quantum alerts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/file_class_alerts.py "$GITHUB_WORKSPACE/uspto-candidates.json"


# registered
